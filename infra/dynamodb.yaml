AWSTemplateFormatVersion: '2010-09-09'
Description: >
  DynamoDB tables for Bedrock spend enforcement.
  - bedrock-spend-enforcement-state: per-user spend snapshot and notification state
  - bedrock-spend-enforcement-exceptions: custom daily limits and manual blocks

Resources:
  StateTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: bedrock-spend-enforcement-state
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH

  ExceptionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: bedrock-spend-enforcement-exceptions
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH

Outputs:
  StateTableArn:
    Value: !GetAtt StateTable.Arn
    Description: Pass as StateDynamoTableArn to infra/lambda.yaml and infra/slash-command.yaml
  ExceptionsTableArn:
    Value: !GetAtt ExceptionsTable.Arn
    Description: Pass as ExceptionsDynamoTableArn to infra/lambda.yaml and infra/slash-command.yaml
