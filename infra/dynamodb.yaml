AWSTemplateFormatVersion: '2010-09-09'
Description: >
  DynamoDB tables for Bedrock spend enforcement: per-user spend state
  (StateTable) and manually-managed spend-limit exceptions (ExceptionsTable).

Resources:
  StateTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: bedrock-spend-enforcement-state
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH
      # Used by the Slack-identity cache (handler._slack_cache_put), keyed
      # __slack_cache__<username> in this same table. Per-user spend/state
      # items never set expires_at, so TTL only ever reaps cache entries.
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true

  ExceptionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: bedrock-spend-enforcement-exceptions
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH

Outputs:
  StateTableArn:
    Value: !GetAtt StateTable.Arn
    Description: Pass this ARN as a parameter to the lambda stack (STATE_TABLE_ARN)
  ExceptionsTableArn:
    Value: !GetAtt ExceptionsTable.Arn
    Description: Pass this ARN as a parameter to the lambda stack (EXCEPTIONS_TABLE_ARN)
